name: Build Hindi Anime APK

# Hindi Anime fork: own workflow, no upstream secrets. Builds the stable
# release APK (unsigned) and uploads it as an artifact. The APK is signed
# locally after download.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hindi-anime-apk
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
